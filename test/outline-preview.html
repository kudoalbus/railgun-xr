<!doctype html><meta charset="utf-8"><title>Hand outline QA</title><style>body{margin:0;background:#050c14;color:white;font:16px sans-serif}p{position:absolute;left:24px}canvas{display:block}</style><p>白色虚线轮廓 / 张手与弯指（合成关节，用于外观验证）</p><script type="module">
import * as T from 'three';import {HandOutline} from '../src/hand-outline.js';import {sampleHand} from './hand-fixture.js';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.001,10),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.setClearColor(0x050c14);document.body.append(renderer.domElement);camera.position.set(0,.065,.66);camera.lookAt(0,.065,0);
for(const [offset,curled]of [[-.095,false],[.095,true]]){const j=sampleHand(curled);for(const p of Object.values(j))p.x+=offset;new HandOutline(scene).update(j)}renderer.render(scene,camera);
</script>
